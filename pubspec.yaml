name: fittrack
description: "A shared Flutter project structure for the FitTrack team."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.12.0+2
  cloud_firestore: ^6.7.1
  firebase_auth: ^6.5.6
  firebase_core: ^4.12.1
  firebase_storage: ^13.4.5
  fl_chart: ^1.2.0
  google_mlkit_pose_detection: ^0.15.0
  image_picker: ^1.2.3
  intl: ^0.20.3
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/body_metric_scale.png
